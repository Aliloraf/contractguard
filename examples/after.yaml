openapi: 3.0.3
info:
  title: Sample Store API
  version: 1.1.0
paths:
  /orders:
    get:
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: string
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, coupon]
              properties:
                itemId:
                  type: string
                coupon:
                  type: string
      responses:
        '201':
          description: Created
