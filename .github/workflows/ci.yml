name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: CLI smoke test on the bundled examples
        run: |
          set +e
          npm run cli -- --base examples/before.yaml --head examples/after.yaml
          code=$?
          set -e
          echo "CLI exit code: $code (1 = breaking changes detected, as expected)"
          test "$code" -eq 1
      - name: Verify bundled action is checked in and current
        run: |
          git ls-files --error-unmatch dist/index.js
          git diff --exit-code -- dist
