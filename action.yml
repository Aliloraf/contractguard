name: ContractGuard
branding:
  icon: shield
  color: blue
description: Detect potentially breaking OpenAPI changes in pull requests.
inputs:
  spec-path:
    description: >-
      Repository-relative path to the OpenAPI 3.0/3.1 YAML or JSON document.
      Absolute paths, and paths outside the checkout, are rejected.
    required: true
  comment:
    description: >-
      Post or update a pull request comment with the report. Requires
      github-token and pull-requests: write permission. A comment that cannot be
      posted is reported as a warning and never changes the check result.
    required: false
    default: 'false'
  github-token:
    description: GITHUB_TOKEN (or a PAT) used for the optional pull request comment.
    required: false
  json-report-path:
    description: >-
      Optional repository-relative file to write the machine-readable JSON report
      to, for example to attach it with actions/upload-artifact. The path must be
      inside the checkout, must not contain symbolic links and must not be the
      specification itself. Missing directories are created.
    required: false
  sarif-report-path:
    description: >-
      Optional repository-relative file to write a SARIF 2.1.0 report to, for
      example to upload it with github/codeql-action/upload-sarif. The same path
      rules as json-report-path apply. The Action itself never uploads anything.
    required: false
outputs:
  breaking:
    description: '"true" when at least one breaking change was detected.'
  breaking-count:
    description: Number of detected breaking changes.
  notice-count:
    description: >-
      Number of places that could not be evaluated and need a manual review.
      These never fail the check on their own.
  json-report-path:
    description: The repository-relative path the JSON report was written to; only set when json-report-path was given.
  sarif-report-path:
    description: The repository-relative path the SARIF report was written to; only set when sarif-report-path was given.
runs:
  using: node24
  main: dist/index.js
